<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- iOS 坑：viewport-fit=cover 让页面延伸进刘海/底部横条区域，配合 CSS 的
     env(safe-area-inset-*) 做留白，否则刘海屏会遮挡内容 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<!-- PWA / 添加到主屏幕（iOS Safari 识别的是 apple-* 这一组标签） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="提词器">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon.png">
<!-- 内嵌 manifest（data URI，避免第二个文件）；# 号必须写成 %23 -->
<link rel="manifest" href='data:application/manifest+json,{"name":"提词器","short_name":"提词器","start_url":".","display":"standalone","background_color":"%23000000","theme_color":"%23000000","icons":[{"src":"icon.png","sizes":"180x180","type":"image/png"}]}'>
<title>提词器</title>
<style>
/* ==================== 基础与 iOS 约束 ==================== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  /* iOS 坑：把 body 固定为视口大小并禁止整页滚动，
     彻底防掉橡皮筋回弹与地址栏收起时的页面跳动；滚动全部发生在内部容器 */
  position:fixed;inset:0;overflow:hidden;
  overscroll-behavior:none;            /* 防下拉刷新 / 橡皮筋 */
  background:#0b0c10;color:#ececf1;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
/* 三个视图单页切换：列表 / 编辑 / 播放 */
.view{display:none;flex-direction:column;
  /* iOS 坑：100vh 在地址栏收起时会撑破布局，优先用 100dvh（旧系统回退 100vh/100%） */
  height:100vh;height:100dvh;height:100%}
.view.active{display:flex}

/* ==================== 顶栏（列表/编辑共用） ==================== */
.topbar{
  display:flex;align-items:center;gap:10px;flex:none;
  padding-top:calc(10px + env(safe-area-inset-top));    /* 让开刘海/灵动岛 */
  padding-bottom:10px;
  padding-left:calc(16px + env(safe-area-inset-left));
  padding-right:calc(16px + env(safe-area-inset-right));
  background:#101116;border-bottom:1px solid #1e1f26;
}
.topbar h1{font-size:20px;font-weight:700;flex:1;letter-spacing:.5px}
.topbar .count{font-size:13px;color:#6d7684}
.btn-primary{background:#2f7bff;color:#fff;border-radius:10px;padding:8px 14px;font-size:15px;font-weight:600;white-space:nowrap}
.btn-primary:active{background:#2568dd}
.btn-ghost{color:#9aa1ad;font-size:16px;padding:8px 2px;white-space:nowrap}

/* ==================== 视图一：脚本列表 ==================== */
.home-hint{
  flex:none;margin:10px 16px 0;
  padding:10px 12px;border-radius:10px;background:#171a21;
  color:#8b93a1;font-size:13px;line-height:1.6;
}
.home-hint b{color:#c9d4e3;font-weight:600}
.scroll-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.script-list{padding:12px 16px calc(110px + env(safe-area-inset-bottom))}
.card{background:#15161c;border:1px solid #23252e;border-radius:14px;padding:14px 14px 10px;margin-bottom:12px}
.card:active{background:#1b1d26}
.card-title{font-size:17px;font-weight:600;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-preview{font-size:14px;color:#8b93a1;line-height:1.5;max-height:4.2em;overflow:hidden;word-break:break-all}
.card-meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.card-time{font-size:12px;color:#5c6370}
.card-actions button{font-size:13px;color:#9aa1ad;padding:7px 12px;border-radius:8px;background:#1d202a;margin-left:8px}
.card-actions button:active{background:#282c38}
.card-actions button.danger{color:#ff6b6b}
.empty{padding:18vh 40px 0;text-align:center;color:#5c6370}
.empty-title{font-size:17px;font-weight:600;color:#8b93a1;margin-bottom:8px}
.empty-sub{font-size:14px;line-height:1.7}
.fab{
  position:fixed;z-index:20;
  right:calc(18px + env(safe-area-inset-right));
  bottom:calc(24px + env(safe-area-inset-bottom));
  width:58px;height:58px;border-radius:50%;
  background:#2f7bff;color:#fff;font-size:32px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 22px rgba(47,123,255,.45);
}
.fab:active{transform:scale(.92)}

/* ==================== 视图二：编辑 ==================== */
.edit-body{
  flex:1;display:flex;flex-direction:column;gap:10px;overflow:hidden;
  padding:12px 16px calc(16px + env(safe-area-inset-bottom));
}
/* iOS 坑：输入框字号小于 16px 时，聚焦会触发 Safari 自动放大页面，必须 >= 16px */
.inp-title{
  flex:none;background:#15161c;border:1px solid #23252e;border-radius:10px;
  color:#fff;font-size:17px;padding:12px;outline:none;
}
.inp-title:focus{border-color:#2f7bff}
.inp-text{
  flex:1;background:#15161c;border:1px solid #23252e;border-radius:10px;
  color:#e8eaf0;font-size:17px;line-height:1.85;padding:12px;outline:none;
  resize:none;-webkit-overflow-scrolling:touch;
}
.inp-text:focus{border-color:#2f7bff}
.save-state{flex:1;text-align:center;font-size:13px;color:#6d7684}
.save-state.dirty{color:#9aa1ad}

/* 防御：下方多个遮罩类自带 display:flex，会覆盖 [hidden] 的浏览器默认 display:none，
   导致 hidden 属性失效、遮罩永久悬浮并拦截舞台点击。必须强制压住。 */
[hidden]{display:none!important}

/* ==================== 视图三：提词播放 ==================== */
/* iOS 坑：iPhone Safari 没有Fullscreen API，用 fixed+inset:0 做伪全屏 */
#view-play{position:fixed;inset:0;z-index:60;background:#000;touch-action:manipulation}
.stage{position:relative;flex:1;overflow:hidden;background:#000;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.scroller{width:100%;will-change:transform}         /* 滚动引擎只改它的 transform */
.mirror-box{width:100%}
.mirror-box.mirrored{transform:scaleX(-1)}           /* 镜像模式：配提词器硬件用 */
.tele-text{
  color:#fff;line-height:1.72;letter-spacing:.02em;
  white-space:pre-wrap;word-break:break-word;        /* 保留脚本换行 */
  padding-left:22px;padding-right:22px;
}
/* 阅读线上下的黑色渐变遮罩，把注意力压到阅读线上 */
.mask-top{position:absolute;left:0;right:0;top:0;height:46%;pointer-events:none;z-index:3;
  background:linear-gradient(to bottom,rgba(0,0,0,.92) 0%,rgba(0,0,0,.55) 45%,rgba(0,0,0,0) 100%)}
.mask-bottom{position:absolute;left:0;right:0;bottom:0;height:46%;pointer-events:none;z-index:3;
  background:linear-gradient(to top,rgba(0,0,0,.92) 0%,rgba(0,0,0,.55) 45%,rgba(0,0,0,0) 100%)}
.readline{position:absolute;left:0;right:0;top:calc(45% - 1px);height:2px;pointer-events:none;z-index:4;
  background:rgba(96,165,250,.6);box-shadow:0 0 10px rgba(96,165,250,.35)}
/* 顶部细进度条（避开状态栏安全区） */
.progress{position:absolute;left:0;right:0;top:env(safe-area-inset-top);height:2px;z-index:6;
  background:rgba(255,255,255,.12);pointer-events:none}
.progress i{display:block;height:100%;width:0;background:#3b82f6}
/* 暂停等轻提示 */
.hint-pill{
  position:absolute;left:50%;top:20%;transform:translateX(-50%);z-index:7;
  background:rgba(18,19,24,.85);color:#dfe3ea;font-size:16px;
  padding:10px 24px;border-radius:22px;pointer-events:none;
  opacity:0;transition:opacity .25s;
}
.hint-pill.show{opacity:1}
/* 3-2-1 倒计时 */
.countdown{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.3)}
.countdown span{font-size:120px;font-weight:700;color:#fff;text-shadow:0 4px 34px rgba(59,130,246,.65)}
.countdown span.zoom{animation:cdzoom .8s ease-out}
@keyframes cdzoom{0%{transform:scale(1.55);opacity:.15}100%{transform:scale(1);opacity:1}}
/* 完成遮罩 */
.done-overlay{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.8)}
.done-text{font-size:26px;font-weight:700;color:#fff}
.done-sub{font-size:15px;color:#9aa1ad}
/* 画中画期间舞台上的提示层（复用完成遮罩的样式思路） */
.pip-overlay{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.8);cursor:pointer}

/* 底部控制条 */
.controls{
  flex:none;display:flex;flex-direction:column;gap:10px;
  background:#0d0e12;border-top:1px solid #1d1f27;
  padding-top:10px;padding-bottom:calc(12px + env(safe-area-inset-bottom));
  padding-left:calc(14px + env(safe-area-inset-left));
  padding-right:calc(14px + env(safe-area-inset-right));
  transition:opacity .35s,transform .35s;
}
.controls.hidden{opacity:0;pointer-events:none;transform:translateY(12px)}
.ctl-row{display:flex;align-items:stretch;justify-content:space-between;gap:8px}
.ctl-row button{
  font-size:14px;color:#c8ceda;background:#1a1c24;border-radius:10px;
  padding:10px 10px;min-width:46px;white-space:nowrap;
}
.ctl-row button:active{background:#262a36}
.ctl-row .ctl-play{flex:1;background:#2f7bff;color:#fff;font-weight:600;font-size:16px}
.ctl-row .ctl-play:active{background:#2568dd}
.ctl-row .toggle.on{background:#123a75;color:#7fb5ff;box-shadow:inset 0 0 0 1px #2f5fb0}
.ctl-adjust{justify-content:space-around}
/* 第一行 6 个按钮挤：收窄字号/内边距/间距，375px（iPhone SE）单行也放得下 */
.ctl-row.ctl-main{gap:5px}
.ctl-row.ctl-main button{font-size:13px;padding:10px 5px;min-width:38px}
.ctl-row.ctl-main .ctl-play{font-size:15px;min-width:44px}
.adj{display:flex;align-items:center;gap:2px;background:#1a1c24;border-radius:10px;padding:2px}
.adj button{min-width:48px;min-height:42px;font-size:17px}
.adj-val{display:flex;flex-direction:column;align-items:center;min-width:56px;padding:0 4px}
.adj-val b{font-size:16px;font-weight:700}
.adj-val i{font-style:normal;font-size:10px;color:#77808f;margin-top:1px}
/* 横屏矮屏微调 */
@media (max-height:420px){
  .controls{padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom));gap:6px}
  .ctl-row button{padding:7px 8px}
  .countdown span{font-size:80px}
  .hint-pill{top:12%}
}

/* 常亮兜底用的隐形视频（1px 级别、近乎透明，但不能 display:none，否则 iOS 会暂停它） */
#keepAwakeVideo{position:fixed;right:0;bottom:0;width:2px;height:2px;opacity:.001;pointer-events:none;z-index:0}
/* 画中画载体视频：同样不能 display:none（媒体流会被暂停），保持 1px 级占位 */
#pipVideo{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none;z-index:0}
</style>
</head>
<body>

<!-- ==================== 视图一：脚本列表 ==================== -->
<section id="view-list" class="view active">
  <header class="topbar">
    <h1>提词器</h1>
    <span class="count" id="scriptCount"></span>
  </header>
  <div class="home-hint" id="homeHint">
    建议用 Safari <b>分享 → 添加到主屏幕</b>，从主屏幕打开即可<b>全屏</b>使用，录口播更顺手
  </div>
  <div class="scroll-area">
    <div id="scriptList" class="script-list"></div>
    <div id="emptyState" class="empty" hidden>
      <div class="empty-title">还没有脚本</div>
      <div class="empty-sub">点右下角「＋」新建一个，<br>把口播稿粘贴进来，就能开始提词了</div>
    </div>
  </div>
  <button class="fab" id="btnNew" aria-label="新建脚本">＋</button>
</section>

<!-- ==================== 视图二：编辑 ==================== -->
<section id="view-edit" class="view">
  <header class="topbar">
    <button class="btn-ghost" id="btnBackList">‹ 返回</button>
    <span class="save-state" id="saveState">已保存</span>
    <button class="btn-primary" id="btnStart">开始提词</button>
  </header>
  <div class="edit-body">
    <input id="inpTitle" class="inp-title" type="text" placeholder="脚本标题" maxlength="60" autocomplete="off" autocapitalize="off" autocorrect="off">
    <textarea id="inpText" class="inp-text" placeholder="在这里粘贴或输入口播稿…&#10;&#10;段落之间建议空一行，提词时更好断句"></textarea>
  </div>
</section>

<!-- ==================== 视图三：提词播放 ==================== -->
<section id="view-play" class="view">
  <div class="stage" id="stage">
    <div class="scroller" id="scroller">
      <div class="mirror-box" id="mirrorBox">
        <div class="tele-text" id="teleText"></div>
      </div>
    </div>
    <div class="mask-top"></div>
    <div class="mask-bottom"></div>
    <div class="readline"></div>
    <div class="progress"><i id="progressBar"></i></div>
    <div class="hint-pill" id="hintPill">已暂停</div>
    <div class="countdown" id="countdownOverlay" hidden><span id="countdownNum">3</span></div>
    <div class="done-overlay" id="doneOverlay" hidden>
      <div class="done-text">已完成</div>
      <div class="done-sub">点击任意处返回编辑</div>
    </div>
    <div class="pip-overlay" id="pipOverlay" hidden>
      <div class="done-text">小窗提词中</div>
      <div class="done-sub">回到本页可调速度 / 暂停<br>点击此处退出小窗</div>
    </div>
  </div>
  <div class="controls" id="controls">
    <div class="ctl-row ctl-main">
      <button id="btnExit">返回</button>
      <button id="btnBackScreen">倒退一屏</button>
      <button id="btnPlay" class="ctl-play">播放</button>
      <button id="btnCountdown" class="toggle">倒计时 关</button>
      <button id="btnMirror" class="toggle">镜像 关</button>
      <button id="btnPip" class="toggle">小窗</button>
    </div>
    <div class="ctl-row ctl-adjust">
      <div class="adj">
        <button id="btnSpeedDown" aria-label="减速">−</button>
        <span class="adj-val"><b id="speedVal">60</b><i>速度</i></span>
        <button id="btnSpeedUp" aria-label="加速">＋</button>
      </div>
      <div class="adj">
        <button id="btnFontDown" aria-label="缩小字号">A−</button>
        <span class="adj-val"><b id="fontVal">48</b><i>字号</i></span>
        <button id="btnFontUp" aria-label="放大字号">A＋</button>
      </div>
    </div>
  </div>
</section>

<!-- 常亮兜底：静音循环微型视频，与 Wake Lock 互补（iOS < 16.4 或锁失效时起作用） -->
<video id="keepAwakeVideo" muted playsinline loop preload="auto" disablepictureinpicture></video>

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtTime(ts) {
    var d = new Date(ts), n = new Date();
    function p(x) { return (x < 10 ? '0' : '') + x; }
    if (d.toDateString() === n.toDateString()) return '今天 ' + p(d.getHours()) + ':' + p(d.getMinutes());
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  /* 是否从主屏幕独立模式打开（iOS 专属的 navigator.standalone + 通用 display-mode） */
  function isStandalone() {
    return window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  }

  /* ==================== 数据层 ==================== */
  var DEFAULT_PREFS = { fontSize: 48, speed: 60, countdown: false, mirror: false };
  var prefs = loadPrefs();
  function loadPrefs() {
    var out = { };
    for (var k in DEFAULT_PREFS) out[k] = DEFAULT_PREFS[k];
    try {
      var raw = JSON.parse(lsGet(PREFS_KEY) || 'null');
      if (raw && typeof raw === 'object') {

  function savePrefs() { lsSet(PREFS_KEY, JSON.stringify(prefs)); }

  var scripts = loadScripts();

      return;

  function layoutPlayer() {
    var stage = $('stage');
    var H = stage.clientHeight;
    if (H <= 0) return;
    var top = Math.round(H * READ_POS);
    var t = $('teleText');

    t.style.paddingBottom = (H - top) + 'px';

  function applyOffset() {

  function stepScroll(ts) {
    if (drag.active) { player.lastTs = ts; return true; }  // 拖动中手动优先，自动滚动让路（只刷新时钟）
    if (!player.lastTs) player.lastTs = ts;
    var dt = Math.min(ts - player.lastTs, 100);
    player.lastTs = ts;
    player.offset += prefs.speed * dt / 1000;
    if (player.offset >= player.maxScroll) {
      player.offset = player.maxScroll;
      applyOffset();
      finishPlay();
      return false;                                     // 已到头，别再排下一帧

    applyOffset();
    setProgress(player.maxScroll > 0 ? player.offset / player.maxScroll : 0);
    return true;
  }
  function frame(ts) {
    if (!player.playing) { player.rafId = 0; return; }
    if (pip.active) { player.rafId = 0; return; }       // PiP 期间由 pipTick 全权驱动，避免双倍速
    if (stepScroll(ts)) player.rafId = requestAnimationFrame(frame);
  }

  function pausePlay() {

  function finishPlay() {

    if (player.rafId) { cancelAnimationFrame(player.rafId); player.rafId = 0; }

    updatePlayBtn();

  function updatePlayBtn() {

  function startCountdown() {

    var step = function () {

      } else {
        player.cdTimer = setTimeout(function () {

          $('countdownOverlay').hidden = true;

  }

    syncControlsUI();
    player.playing = false; player.counting = false; player.done = false;
    player.offset = 0; player.lastTs = 0;
    $('doneOverlay').hidden = true;
    $('countdownOverlay').hidden = true;
    $('pipOverlay').hidden = true;

    setProgress(0);
    updatePlayBtn();

  }
  function exitPlay() {

  $('stage').addEventListener('click', function () {

    setFontSize(pinch.startFont * d / pinch.startDist, false);   // 捏合中只改内存，松手统一落盘

  /* ==================== 画中画小窗（PiP） ====================
     场景：用相机 app 录视频时，提词文字以系统画中画小窗悬浮滚动。
     思路：离屏 canvas 逐帧画提词画面 → captureStream 当视频源，
     再用 WebAudio 造一条静音音轨合并进去（iOS Safari 的 PiP 要求视频带音轨），
     塞进一个隐藏 video 后请求画中画。滚动数据与全屏共用同一 player.offset，
     在本页暂停/调速，小窗实时同步。 */
  var PIP_FONT = '-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif';
  var pip = {
    active: false,        // 是否处于小窗
    video: null,          // 隐藏的 PiP 载体视频
    canvas: null, ctx: null,
    csStream: null,       // canvas 的 captureStream（退出时停轨省电）
    stream: null,         // 视频轨 + 静音音轨的合成流
    audioCtx: null, audioDest: null,
    tickId: 0,           // 小窗定时器驱动（rAF 后台会停）
    wrapKey: '', lines: null, lastOff: -1
  };
  function pipSupportOk() {
    if (document.pictureInPictureEnabled) return true;          // 标准 API（Chrome / 新版 Safari）
    var v = pip.video || document.createElement('video');        // iOS Safari 只在 video 实例上暴露 webkit 探测属性
    return !!(v && v.webkitSupportsPictureInPicture);
  }
  function pipActiveNow() {
    if (document.pictureInPictureElement) return true;
    var v = pip.video;
    return !!(v && v.webkitPresentationMode === 'picture-in-picture');
  }
  function pipFontStr(px) { return px.toFixed(1) + 'px ' + PIP_FONT; }

  /* 逐字符测宽换行（中文场景按字断行即可，不做英文单词断行） */
  function pipWrap(text, fontPx, maxW) {
    var ctx = pip.ctx;
    ctx.font = pipFontStr(fontPx);
    var out = [];
    var paras = String(text).split('\n');
    for (var i = 0; i < paras.length; i++) {
      var s = paras[i];
      if (!s) { out.push(''); continue; }               // 空行占一行，对应 DOM 的 pre-wrap
      var line = '';
      for (var j = 0; j < s.length; j++) {
        var next = line + s.charAt(j);
        if (line && ctx.measureText(next).width > maxW) { out.push(line); line = s.charAt(j); }
        else line = next;
      }
      out.push(line);
    }
    return out;
  }

  /* 把当前提词画面画到 canvas：黑底 + 按同一 offset 排版文本 + 阅读线。
     横向画布按宽度对齐全屏（scale = 画布宽/舞台宽）：小窗一行显示的字数与全屏
     一致、行数少但字大清楚；总滚动量同比放大，读完用时与全屏几乎相同（<2% 差异）。 */
  function pipDraw(force) {
    if (!pip.ctx) return;
    var c = pip.canvas, ctx = pip.ctx;
    var cw = c.width, ch = c.height;
    var stage = $('stage');
    var sh = stage.clientHeight || 1, sw = stage.clientWidth || 1;
    var scale = cw / sw;
    var fontPx = prefs.fontSize * scale;
    var padX = Math.max(4, Math.round(22 * cw / sw));   // 对应 DOM 的左右 22px padding
    var maxW = cw - padX * 2;
    var text = $('teleText').textContent || '';
    var key = pipFontStr(fontPx) + '|' + maxW + '|' + text.length;
    if (key !== pip.wrapKey) { pip.wrapKey = key; pip.lines = pipWrap(text, fontPx, maxW); pip.lastOff = -1; }   // 字号/宽度变了：重排并强制重绘（暂停中调字号小窗也要跟着变）
    var off = player.offset * scale;                    // 与全屏 DOM 共用同一滚动量
    if (!force && Math.abs(off - pip.lastOff) < 0.5) return;   // 脏检查：没动就跳过重绘
    pip.lastOff = off;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, cw, ch);
    if (prefs.mirror) ctx.setTransform(-1, 0, 0, 1, cw, 0);    // 镜像模式与全屏 DOM 保持一致
    ctx.font = pipFontStr(fontPx);
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    var lh = fontPx * 1.72;                             // 与 DOM line-height 1.72 对齐
    var y0 = ch * READ_POS - off;                       // 第 0 行顶边 = 阅读线位置 − 滚动量
    var lines = pip.lines || [];
    for (var i = 0; i < lines.length; i++) {
      var top = y0 + i * lh;
      if (top + lh < 0) continue;                       // 还没滚进画面
      if (top > ch) break;                              // 已滚出画面
      if (lines[i]) ctx.fillText(lines[i], padX, top + lh / 2);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = 'rgba(96,165,250,.6)';              // 阅读线：与全屏样式同色
    ctx.fillRect(0, Math.round(ch * READ_POS), cw, 2);
  }
  /* 小窗驱动循环：rAF 在后台页面会被系统停掉（真机踩坑：切到相机后小窗静止不滚），
     改用 setInterval——带活跃媒体会话的页面后台定时器仍可运行（最坏被节流到约 1 次/秒，
     慢但不会停）。前台也统一用它，与 rAF 并行会双倍速。
     滚完也不停表：captureStream 长时间无新帧可能被系统判为流停滞 → 小窗黑屏（真机踩坑），
     脏检查让空转成本近零。 */
  function pipTickOn() {
    if (pip.tickId) return;
    pip.tickId = setInterval(function () {
      if (!pip.active) { pipTickOff(); return; }
      if (player.playing) stepScroll(performance.now());
      pipDraw(false);                                  // 脏检查：没变化就跳过重绘
    }, 30);
  }
  function pipTickOff() {
    if (pip.tickId) { clearInterval(pip.tickId); pip.tickId = 0; }
  }
  function onPipEnter() {
    if (pip.active) return;                             // 标准/webkit 两套事件去重
    pip.active = true;
    $('pipOverlay').hidden = false;
    $('btnPip').classList.add('on');
    pip.lastOff = -1;                                   // 强制进入后第一帧重绘
    /* 进小窗的意图就是提词：未在播放且未完成时自动开始滚（真机反馈：弹了窗等人回页点播放，不直观） */
    if (!player.playing && !player.done && player.maxScroll > 0) startPlay();
    /* 主滚动 rAF 让位给定时器驱动，避免双驱动双倍速 */
    if (player.rafId) { cancelAnimationFrame(player.rafId); player.rafId = 0; }
    pipTickOn();
    pipDraw(true);
  }
  function onPipLeave() {
    if (!pip.active) return;
    pip.active = false;
    $('pipOverlay').hidden = true;
    $('btnPip').classList.remove('on');
    pipTickOff();
    /* 回前台：仍在播放态就恢复 rAF 驱动（比定时器顺滑） */
    if (player.playing && !player.rafId) { player.lastTs = 0; player.rafId = requestAnimationFrame(frame); }
    /* 全屏 DOM 渲染从未停过，无需恢复；断开媒体流、停掉视频轨省电 */
    try { if (pip.video) pip.video.srcObject = null; } catch (e) { }
    try {
      if (pip.csStream) {
        var ts = pip.csStream.getVideoTracks();
        for (var i = 0; i < ts.length; i++) ts[i].stop();
      }
    } catch (e) { }
    pip.csStream = null; pip.stream = null;
    pip.canvas = null; pip.ctx = null;                  // 画布随流一起丢弃：下次进入全新建（防死流）
  }
  function exitPip() {
    try {
      if (document.pictureInPictureElement && document.exitPictureInPicture) document.exitPictureInPicture();
    } catch (e) { /* 忽略 */ }
    try {
      var v = pip.video;
      if (v && v.webkitPresentationMode === 'picture-in-picture' && v.webkitSetPresentationMode) {
        v.webkitSetPresentationMode('inline');
      }
    } catch (e) { /* 忽略 */ }
  }
  function enterPip() {
    if (isStandalone()) {
      /* iOS 主屏幕独立模式（桌面图标）不支持画中画：视频永远 not ready，请求必被拒
         （真机踩坑：报 InvalidStateError）。给出明确指引而不是英文报错。 */
      toast('桌面图标模式不支持小窗：请在 Safari 标签页打开本页使用', 4000);
      return;
    }
    if (!pipSupportOk()) { toast('当前设备不支持小窗'); return; }
    try {
      var v = pip.video;
      if (!v) {
        v = document.createElement('video');
        v.id = 'pipVideo';
        v.muted = true;
        v.setAttribute('playsinline', '');              // 没有它 iOS 不给内联播放
        document.body.appendChild(v);
        pip.video = v;
        /* 两套事件都挂：标准 API 用 enter/leave，iOS Safari webkit 路径用 presentationmodechanged */
        v.addEventListener('enterpictureinpicture', onPipEnter);
        v.addEventListener('leavepictureinpicture', onPipLeave);
        v.addEventListener('webkitpresentationmodechanged', function () {
          if (v.webkitPresentationMode === 'picture-in-picture') onPipEnter();
          else onPipLeave();
        });
      }
      /* 每次进入都新建 canvas：同一 canvas 上旧 captureStream 的轨被 stop 后，
         再取流会拿到空流/死流（真机踩坑：退出后重进小窗，readyState 恒 0、请求发不出） */
      pip.canvas = document.createElement('canvas');
      pip.canvas.width = 1280; pip.canvas.height = 720;   // 16:9 横向小窗：竖屏录像时横在画面上/下沿更顺手
      pip.ctx = pip.canvas.getContext('2d');
      pip.wrapKey = ''; pip.lines = null; pip.lastOff = -1;
      var tracks = [];
      if (pip.canvas.captureStream) {
        pip.csStream = pip.canvas.captureStream(30);
        tracks = pip.csStream.getVideoTracks();
      }
      if (!tracks.length) { toast('当前设备不支持小窗'); return; }
      /* iOS Safari 关键坑：PiP 要求视频带音轨 → WebAudio 造一条人耳不可闻的真实信号音轨
         （20Hz 次声 + 极低增益；全 0 信号会被部分 iOS 版本判为无效音轨）。
         AudioContext 的创建与 resume 都必须在用户手势内同步完成。 */
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) {
          if (!pip.audioCtx) {
            pip.audioCtx = new AC();
            pip.audioDest = pip.audioCtx.createMediaStreamDestination();
            var osc = pip.audioCtx.createOscillator();
            osc.frequency.value = 20;
            var gain = pip.audioCtx.createGain();
            gain.gain.value = 0.0001;
            osc.connect(gain); gain.connect(pip.audioDest);
            osc.start();
          }
          if (pip.audioCtx.state === 'suspended' && pip.audioCtx.resume) pip.audioCtx.resume();
          var at = pip.audioDest.stream.getAudioTracks()[0];
          if (at) tracks.push(at);
        }
      } catch (e2) { /* 造不出音轨也继续试，部分环境无音轨也能进 */ }
      pip.stream = new MediaStream(tracks);
      v.srcObject = pip.stream;
      pipDraw(true);                                    // 先画一帧，避免小窗打开瞬间黑屏
      var pr = v.play();
      if (pr && pr.catch) pr.catch(function () { /* muted 内联播放一般不会被拒 */ });
      function pipFail(msg) {
        toast('进入小窗失败：' + msg, 3500);
        try { window.__pipErr = msg; } catch (e3) { /* 诊断残留 */ }
      }
      if ((document.pictureInPictureEnabled && v.requestPictureInPicture) ||
          (v.webkitSupportsPictureInPicture && v.webkitSetPresentationMode)) {
        /* 真机踩坑（Chromium 与 Safari 皆然）：流视频 play() 后 metadata/首帧未就绪就请求 PiP
           会被拒（InvalidStateError / webkit 静默失败）。
           PiP 的用户手势有效期约 5 秒，足够轮询等首帧（100ms 一次，最多 2.5s）后请求。 */
        var tries = 0;
        var tryEnter = function () {
          if (pipActiveNow()) return;
          if (v.readyState >= 2 || tries > 25) {
            if (document.pictureInPictureEnabled && v.requestPictureInPicture) {
              try {
                var p = v.requestPictureInPicture();
                if (p && p.catch) p.catch(function (err) {
                  pipFail((err && (err.name + ' ' + err.message)) || '未知错误');
                });
              } catch (err) { pipFail((err && err.message) || '同步异常'); }
            } else {
              try { v.webkitSetPresentationMode('picture-in-picture'); }
              catch (e3) { pipFail(e3 && e3.message ? e3.message : 'Safari 抛错'); return; }
              /* 该接口同步不抛错也可能静默失败：600ms 后复查是否真的进入 */
              setTimeout(function () {
                if (v.webkitPresentationMode !== 'picture-in-picture' && !pipActiveNow()) {
                  pipFail('Safari 拒绝 (readyState=' + v.readyState + ')');
                }
              }, 600);
            }
            return;
          }
          tries++;
          setTimeout(tryEnter, 100);
        };
        tryEnter();
      } else {
        toast('当前设备不支持小窗', 3500);
      }
    } catch (e) { toast('进入小窗失败：' + ((e && e.message) || '未知'), 3500); }
  }
  $('btnPip').addEventListener('click', function () {
    if (pip.active || pipActiveNow()) { exitPip(); return; }
    enterPip();
  });
  $('pipOverlay').addEventListener('click', function (e) { e.stopPropagation(); exitPip(); });

  /* ---- 控制条显隐：4 秒无操作淡出；仅播放中隐藏，暂停时保持可见方便调整 ---- */
  var hideTimer = 0;
  function scheduleHide() {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () {
      if (player.playing) $('controls').classList.add('hidden');
    }, 4000);
  }
  function showControls() {
    $('controls').classList.remove('hidden');
    scheduleHide();
  }
  $('controls').addEventListener('pointerdown', function () { showControls(); });

  /* ---- 轻提示 ---- */
  var pillTimer = 0;
  function toast(msg, ms) {
    var el = $('hintPill');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(pillTimer);
    pillTimer = setTimeout(function () { el.classList.remove('show'); }, ms || 1100);
  }

  /* ---- 屏幕常亮：Wake Lock（iOS 16.4+）为主，静音循环视频兜底 ---- */
  function requestWakeLock() {
    try {
      if ('wakeLock' in navigator && navigator.wakeLock && navigator.wakeLock.request) {
        /* request() 在无痕/未聚焦等情况下会 reject，必须捕获，避免 unhandledrejection */
        var p = navigator.wakeLock.request('screen');
        if (p && p.then) p.then(function (lock) {
          wakeLock = lock;
          lock.addEventListener('release', function () { wakeLock = null; });
        }, function () { /* 拿不到锁就靠视频兜底 */ });
      }
    } catch (e) { /* 旧系统没有 wakeLock */ }
  }
  function releaseWakeLock() {
    try { if (wakeLock) wakeLock.release(); } catch (e) { /* 已释放 */ }
    wakeLock = null;
  }
  function keepAwakeOn() {
    requestWakeLock();
    try {
      var v = $('keepAwakeVideo');
      if (!v.src) v.src = KEEP_AWAKE_MP4;
      v.currentTime = 0;
      var pr = v.play();
      if (pr && pr.catch) pr.catch(function () { /* 静默失败，Wake Lock 仍在 */ });
    } catch (e) { /* 忽略 */ }
  }
  function keepAwakeOff() {
    releaseWakeLock();
    try { $('keepAwakeVideo').pause(); } catch (e) { /* 忽略 */ }
  }
  /* 切后台：自动暂停（防跳读）；回前台：补请求 Wake Lock（系统切后台时会自动释放它） */
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') {
      if (player.counting) cancelCountdown();
      if (pip.active) return;                 // 小窗提词中切到相机等 app：不自动暂停，让小窗继续滚
      if (player.playing) { pausePlay(); toast('已暂停'); }
    } else if (currentView === 'play') {
      requestWakeLock();
    }
  });

  /* ---- 尺寸变化（旋转 / 地址栏收起）：重算布局并保持进度 ---- */
  var rzTimer = 0;
  window.addEventListener('resize', function () {
    clearTimeout(rzTimer);
    rzTimer = setTimeout(function () {
      if (currentView === 'play') {
        layoutPlayer();
        applyOffset();
        setProgress(player.maxScroll > 0 ? player.offset / player.maxScroll : 0);
      }
    }, 150);
  });

  /* ==================== 启动 ==================== */
  /* 请求持久化存储：降低 Safari ITP 对 7 天未使用站点清掉 localStorage 的概率。
     不在首屏抢着弹（它无 UI、静默），跟着第一次用户交互一起触发。 */
  var persisted = false;
  document.addEventListener('pointerdown', function () {
    if (persisted) return;
    persisted = true;
    try {
      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persist().then(function () { }, function () { });
      }
    } catch (e) { /* 忽略 */ }
  }, { capture: true, once: true });

  if (isStandalone()) $('homeHint').hidden = true;   // 已从主屏幕打开就不再提示
  showView('list');

  /* 部署到 HTTP(S) 后注册 Service Worker 提供真离线；
     本地 file:// 直接打开时没有 SW，跳过即可（localStorage 照常工作） */
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    try { navigator.serviceWorker.register('./sw.js').catch(function () {}); } catch (e) { /* 忽略 */ }
  }
})();
</script>
</body>
</html>
